<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bhanu's Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ff6f61;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        ul {
            list-style-type: none;
            padding: 20px;
            margin: 30px auto;
            max-width: 800px;
            background-color: #fff3cd;
            border: 2px dashed #ff6f61;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        li {
            margin: 15px 0;
            padding: 10px;
            background-color: #d4edda;
            border-left: 6px solid #28a745;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        li:hover {
            transform: scale(1.03);
            background-color: #c3e6cb;
        }

        h2 {
            color: #155724;
        }

        h3 {
            color: #856404;
            font-style: italic;
            padding: 10px;
            background-color: #fff3cd;
            border-radius: 8px;
        }

        .MainPage-button {
            display: block;
            margin: 30px auto;
            padding: 12px 24px;
            background-color: #17a2b8;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 50px;
            transition: background-color 0.3s ease-in-out;
            text-align: center;
            width: fit-content;
        }

        .MainPage-button:hover {
            background-color: #138496;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to Bhanu Pritam Vempali's Page</h1>
    </header>

    <ul>
        <h3>Professor Feedback: You need to add all 3 reflections</h3>
        <li>
            <h2>Building the Repo</h2>
        </li>
        <!-- You can add more reflection points like below -->
        <li>
            <h2>Learning Git Workflow</h2>
        </li>
        <li>
            <h2>Final Project Setup</h2>
        </li>
    </ul>

    <!-- Return to Main Page -->
    <a href="../index.html" class="MainPage-button">⬅ Return to Main Page</a>
</body>

</html>
